name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Buscar y extraer ZIP de la app
      run: |
        ZIP_FILE=$(find . -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          unzip -q "$ZIP_FILE" -d extracted_project
          cp -r extracted_project/*/* . 2>/dev/null || cp -r extracted_project/* . 2>/dev/null || true
        fi

    - name: Forzar creacion de archivos de configuracion ausentes
      run: |
        touch .env .env.example local.properties
        mkdir -p app
        touch app/.env app/.env.example app/local.properties
        echo '{}' > google-services.json
        echo '{}' > app/google-services.json

    - name: Configurar Java 21 Definitivo
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Instalar motor Gradle 8.4 Compatible
      run: |
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew

    - name: Compilar APK sin cache corrupta
      run: |
        export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"
        ./gradlew clean assembleDebug --no-daemon --stacktrace -Pandroid.experimental.disableSdkDownload=true

    - name: Descargar App debug
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
