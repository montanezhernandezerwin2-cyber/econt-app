name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: 1. Extraer proyecto de forma limpia
      run: |
        ZIP_FILE=$(find . -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          unzip -q "$ZIP_FILE" -d extracted_project
          cp -r extracted_project/*/* . 2>/dev/null || cp -r extracted_project/* . 2>/dev/null || true
          rm -rf extracted_project
        fi

    - name: 2. Forzar archivos de entorno y parches de compatibilidad
      run: |
        touch .env .env.example local.properties
        mkdir -p app
        touch app/.env app/.env.example app/local.properties
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
        echo "sdk.dir=/usr/local/lib/android/sdk" > app/local.properties
        echo '{}' > google-services.json
        echo '{}' > app/google-services.json

    - name: 3. Configurar Entorno Java 21 Nativo
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: 4. Reparar y alinear versiones del Motor Gradle
      run: |
        rm -rf gradle/wrapper/gradle-wrapper.properties
        mkdir -p gradle/wrapper
        echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
        echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        gradle wrapper --gradle-version 8.4 --distribution-type bin
        chmod +x gradlew

    - name: 5. Compilar APK saltando bloqueos de plugins
      run: |
        export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dorg.gradle.warning.mode=none"
        ./gradlew assembleDebug --no-daemon --stacktrace -Pandroid.experimental.disableSdkDownload=true

    - name: 6. Guardar y empaquetar APK Final
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
