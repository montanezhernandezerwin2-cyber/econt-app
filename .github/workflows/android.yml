name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Buscar y extraer ZIP de la app
      run: |
        ZIP_FILE=$(find . -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          unzip -q "$ZIP_FILE" -d extracted_project
          cp -r extracted_project/*/* . 2>/dev/null || cp -r extracted_project/* . 2>/dev/null || true
        fi
    
    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Permisos de ejecucion
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          cd $(dirname "$GRADLEW_PATH")
          chmod +x gradlew
        fi

    - name: Compilar APK
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          cd $(dirname "$GRADLEW_PATH")
          ./gradlew assembleDebug --no-daemon
        else
          echo "No se encontro el archivo gradlew"
          exit 1
        fi

    - name: Descargar App debug
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
